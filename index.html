<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>D&D 5e Magic Item Looter</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>D&D 5e Magic Item Looter</h1>
    <div class="toolbar">

    <div id="loginControls">

        <button id="loginButton">
            Google Login
        </button>

        <input
            type="email"
            id="emailInput"
            placeholder="Email"
        >

        <input
            type="password"
            id="passwordInput"
            placeholder="Password"
        >

        <button id="registerButton">
            Register
        </button>

        <button id="emailLoginButton">
            Login
        </button>

    </div>

    <button id="logoutButton" style="display:none;">
        Logout
    </button>

    <span id="userDisplay">
        Not logged in
    </span>

    <input
        type="text"
        id="search"
        placeholder="Search Items..."
    >

    <details class="filter-panel">

        <summary>
            Filters
        </summary>

        <div class="filter-grid">

            <select id="categoryFilter">
                <option value="">All Categories</option>
                <option value="Armor">Armor</option>
                <option value="Potion">Potion</option>
                <option value="Scroll">Scroll</option>
                <option value="Wand">Wand</option>
                <option value="Weapon">Weapon</option>
                <option value="Wondrous Item">Wondrous Item</option>
            </select>

            <select id="rarityFilter">
                <option value="">All Rarities</option>
                <option value="Common">Common</option>
                <option value="Uncommon">Uncommon</option>
                <option value="Rare">Rare</option>
                <option value="Very Rare">Very Rare</option>
                <option value="Legendary">Legendary</option>
            </select>

            <select id="sourceFilter">
                <option value="">
                    All Sources
                </option>
            </select>

            <select id="campaignFilter">
                <option value="">
                    All Campaigns
                </option>
            </select>

            <select id="classFilter">
                <option value="">All Classes</option>
                <option value="Artificer">Artificer</option>
                <option value="Barbarian">Barbarian</option>
                <option value="Bard">Bard</option>
                <option value="Cleric">Cleric</option>
                <option value="Druid">Druid</option>
                <option value="Fighter">Fighter</option>
                <option value="Monk">Monk</option>
                <option value="Paladin">Paladin</option>
                <option value="Ranger">Ranger</option>
                <option value="Rogue">Rogue</option>
                <option value="Sorcerer">Sorcerer</option>
                <option value="Warlock">Warlock</option>
                <option value="Wizard">Wizard</option>
            </select>

        </div>

        <fieldset class="filter-checkboxes">

            <legend>Status</legend>

            <label>
                <input
                    type="checkbox"
                    id="showLootedOnly"
                >
                Looted
            </label>

            <label>
                <input
                    type="checkbox"
                    id="showUnlootedOnly"
                >
                Unlooted
            </label>

            <label>
                <input
                    type="checkbox"
                    id="showAttunementOnly"
                >
                Attuned
            </label>

            <label>
                <input
                    type="checkbox"
                    id="showNoAttunementOnly"
                >
                Not Attuned
            </label>

            <label>
                <input
                    type="checkbox"
                    id="showPrintedOnly"
                >
                Printed
            </label>

            <label>
                <input
                    type="checkbox"
                    id="showNotPrintedOnly"
                >
                Not Printed
            </label>

        </fieldset>

    </details>

</div>
<div id="characterPanel">

    <h3>My Character</h3>

    <input
        type="text"
        id="characterName"
        placeholder="Character Name"
    >

    <select id="characterClass">
        <option value="Artificer">Artificer</option>
        <option value="Barbarian">Barbarian</option>
        <option value="Bard">Bard</option>
        <option value="Cleric">Cleric</option>
        <option value="Druid">Druid</option>
        <option value="Fighter">Fighter</option>
        <option value="Monk">Monk</option>
        <option value="Paladin">Paladin</option>
        <option value="Ranger">Ranger</option>
        <option value="Rogue">Rogue</option>
        <option value="Sorcerer">Sorcerer</option>
        <option value="Warlock">Warlock</option>
        <option value="Wizard">Wizard</option>
    </select>

    <button id="createCharacterButton">
        Create Character
    </button>

</div>
<div id="adminPanel"></div>
<div id="campaignStats"></div>
<div id="card-container"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
