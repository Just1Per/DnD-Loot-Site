name: Personal creature library checks
on:
  pull_request:
    paths:
      - 'js/modules/personal-creature-library.js'
      - 'js/modules/campaign-creatures-ui.js'
      - 'js/modules/campaign-workspace-ui.js'
      - 'tests/personal-creature-library.test.cjs'
      - '.github/workflows/personal-creatures.yml'
  push:
    branches: [main]
    paths:
      - 'js/modules/personal-creature-library.js'
      - 'js/modules/campaign-creatures-ui.js'
      - 'js/modules/campaign-workspace-ui.js'
      - 'tests/personal-creature-library.test.cjs'
jobs:
  personal-creatures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check personal creature modules
        run: |
          node --check js/modules/personal-creature-library.js
          node --check js/modules/campaign-creatures-ui.js
          node --check js/modules/campaign-workspace-ui.js
      - name: Run personal creature library regression tests
        run: node tests/personal-creature-library.test.cjs
