<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Export Firebase Items</title>
</head>

<body>

<h2>Firebase Item Export</h2>

<button id="export">Export Items</button>

<p id="status"></p>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {
    apiKey: "AIzaSyDyj69qiEnKkK4lZjleGnvFEGUdvLcSZIk",
    authDomain: "dnd-loot-site.firebaseapp.com",
    projectId: "dnd-loot-site",
    storageBucket: "dnd-loot-site.firebasestorage.app",
    messagingSenderId: "345641251366",
    appId: "1:345641251366:web:081fe07bc2cc859901ace7",
    measurementId: "G-ZHNPHYLDJ0"
};


const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


document.getElementById("export").addEventListener("click", async () => {

    const status = document.getElementById("status");

    status.textContent = "Loading items...";

    try {

        const snapshot = await getDocs(
            collection(db, "items")
        );


        const items = snapshot.docs
            .map(doc => {

                const data = doc.data();

                return {
                    id: doc.id,
                    name: data.name ?? null,
                    category: data.category ?? null,
                    description: data.description ?? null
                };

            })
            .sort((a, b) =>
                (a.name || "").localeCompare(b.name || "")
            );


        status.textContent =
            `Found ${items.length} items. Creating file...`;


        const json = JSON.stringify(items, null, 2);


        const blob = new Blob(
            [json],
            { type: "application/json" }
        );


        const url = URL.createObjectURL(blob);

        const link = document.createElement("a");

        link.href = url;
        link.download = "firebase-items.json";

        document.body.appendChild(link);

        link.click();

        document.body.removeChild(link);

        URL.revokeObjectURL(url);


        status.textContent =
            `Done! Exported ${items.length} items.`;

    } catch (error) {

        console.error(error);

        status.textContent =
            "Error: " + error.message;

    }

});

</script>

</body>
</html>
